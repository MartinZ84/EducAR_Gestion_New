<body class="font-body-lg text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface shadow-sm flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-md">
<button class="active:scale-95 transition-transform p-xs hover:bg-surface-container-high rounded-full">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Nuevo Docente</h1>
</div>
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-xs rounded-full transition-colors active:scale-95">notifications</button>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<img alt="User" class="w-full h-full object-cover" data-alt="A professional headshot of a teacher in an academic setting, wearing professional attire. The background is a blurred university corridor with soft daylighting, emphasizing a sense of education and reliability. The overall color palette is warm and inviting, consistent with the Material Design 3 surface tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIGpPqwiy39uTnnEEEp1VSi3RxZ2MtilBxJ2_tmHHChzgDIGJXgG4AX3rSV4hno8Qyc7MFFXR1Vdilh9nshoBct0nWv3J0bfwN3T6NcF5TdJ0ZcVBbU75PPO_ftgCs1DmlQ0nAiBFVYe1-4uneUjzeZPTdqxlSl9HP0oJIvJUR4vQd6OMhw1Kgx8eI39kl76oOkpXDl2nTS6p7IyzKr1W93RInY_Xm_c_KPIrr5BLRe7LDs4cJDiUhzpXj44VXfw4tPol6ET5DczLc">
</div>
</div>
</header>
<main class="max-w-xl mx-auto px-margin-mobile py-lg pb-32">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-24 h-24 rounded-full bg-surface-container-high border-2 border-outline-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary p-xs rounded-full shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-body-lg">photo_camera</span>
</button>
</div>
<p class="mt-sm font-label-lg text-label-lg text-primary">Subir foto de perfil</p>
</section>
<!-- Form Content -->
<form class="space-y-lg">
<!-- DNI Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">DNI</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">badge</span>
<input class="w-full h-14 pl-12 pr-md bg-surface border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" placeholder="Ej: 12.345.678" type="text">
</div>
</div>
<!-- Nombre Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Nombre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">person</span>
<input class="w-full h-14 pl-12 pr-md bg-surface border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" placeholder="Ingrese nombre completo" type="text">
</div>
</div>
<!-- Apellido Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Apellido</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">person_4</span>
<input class="w-full h-14 pl-12 pr-md bg-surface border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" placeholder="Ingrese apellido" type="text">
</div>
</div>
<!-- Teléfono Field -->

<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Teléfono</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant">call</span>
<input class="w-full h-14 pl-12 pr-md bg-surface border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg outline-none" placeholder="+54 9..." type="tel">
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs">Email Institucional</label>
<div class="relative flex items-center">

</div>
<!-- Status Switch -->

<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Estado del Docente</span>

<span class="material-symbols-outlined mt-1">info</span>
<div class="space-y-xs">

<p class="font-body-md text-body-md opacity-90">Los permisos de acceso y el grado asignado se podrán configurar una vez dado de alta el docente en la base central.</p>
</div>
</div>
</form>
</main>
<!-- Bottom Actions / Floating Save -->
<div class="fixed bottom-0 left-0 w-full p-md bg-gradient-to-t from-background via-background to-transparent pointer-events-none">
<div class="max-w-xl mx-auto flex gap-md pointer-events-auto">
<button class="flex-1 h-14 font-title-md text-title-md text-primary border border-primary rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
                Cancelar
            </button>
<button class="flex-[2] h-14 font-title-md text-title-md text-on-primary bg-primary rounded-full shadow-lg hover:shadow-xl hover:bg-primary-container transition-all active:scale-95 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">save</span>
                Guardar Docente

<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:scale-95 transition-transform px-lg py-xs">
<span class="material-symbols-outlined">mail</span>
<span class="font-label-sm text-label-sm">Mensajes</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:scale-95 transition-transform px-lg py-xs">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</button>
</nav>
<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#005bbf';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#414754';
            });
        });

        // Form submission ripple simulation
        const saveBtn = document.querySelector('button.bg-primary');
        saveBtn.addEventListener('click', (e) => {
            const rect = saveBtn.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = 'rgba(255, 255, 255, 0.4)';
            ripple.style.borderRadius = '50%';
            ripple.style.top = `${e.clientY - rect.top}px`;
            ripple.style.left = `${e.clientX - rect.left}px`;
            ripple.style.transform = 'scale(0)';
            ripple.style.transition = 'transform 0.6s ease-out, opacity 0.6s ease-out';
            ripple.style.pointerEvents = 'none';
            
            saveBtn.appendChild(ripple);
            
            requestAnimationFrame(() => {
                ripple.style.transform = 'scale(15)';
                ripple.style.opacity = '0';
            });
            
            setTimeout(() => ripple.remove(), 600);
        });
    </script>
