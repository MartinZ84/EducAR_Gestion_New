</div>
</div>
<!-- Password field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-lg text-label-lg text-primary hover:underline" href="#">¿Olvidó su clave?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                            lock
                        </span>
<input class="w-full h-[56px] pl-[48px] pr-[48px] bg-transparent border border-outline rounded-lg font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:bg-surface-container-high rounded-full p-xs transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Button -->
<div class="pt-sm">
<button class="btn-primary w-full h-[48px] bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-sm hover:bg-primary-container hover:shadow-md active:scale-95 transition-all flex items-center justify-center gap-sm" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<!-- Footer links -->
<div class="flex flex-col items-center pt-md border-t border-outline-variant space-y-sm">
<p class="font-body-md text-body-md text-on-surface-variant">¿No tiene una cuenta?</p>
<button class="font-label-lg text-label-lg text-primary border border-outline-variant px-lg py-xs rounded-full hover:bg-surface-container-high transition-colors">
                    Solicitar acceso
                </button>
</div>
</div>
</main>
<!-- Page Footer -->
<footer class="mt-xl text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">
            © 2024 EducAR Gestión. Sistema de Administración Académica.
        </p>
</footer>
<!-- Interactive Scripts -->
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple form handling for visual feedback
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Validando...';
            
            setTimeout(() => {
                btn.classList.replace('bg-primary', 'bg-tertiary');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Éxito';
                setTimeout(() => {
                    alert('Acceso concedido. Redirigiendo al Dashboard de EducAR Gestión...');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', 'bg-primary');
                }, 1000);
            }, 1500);
        });
    </script>
</body></html>
