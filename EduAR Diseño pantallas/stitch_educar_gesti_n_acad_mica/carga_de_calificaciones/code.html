<script>
        // Simple Micro-interaction for inputs
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const val = parseFloat(e.target.value);
                const card = e.target.closest('article');
                if (val >= 7) {
                    card.classList.add('border-l-4', 'border-l-tertiary');
                } else if (val < 4 && val > 0) {
                    card.classList.add('border-l-4', 'border-l-error');
                } else {
                    card.classList.remove('border-l-4', 'border-l-tertiary', 'border-l-error');
                }
            });
        });

        // Mass entry "Tab" simulation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const current = document.activeElement;
                if (current.tagName === 'INPUT') {
                    const allInputs = Array.from(document.querySelectorAll('input'));
                    const index = allInputs.indexOf(current);
                    if (index > -1 && index < allInputs.length - 1) {
                        allInputs[index + 1].focus();
                        e.preventDefault();
                    }
                }
            }
        });
    </script>
