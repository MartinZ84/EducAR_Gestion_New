<body class="font-body-lg text-on-surface">
<!-- TopAppBar -->

</div>

<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a primary school teacher, a woman in her late 30s with a kind and intelligent expression, wearing a navy blue blazer over a crisp white shirt. The lighting is soft and natural, emphasizing a bright, high-key educational environment. The background is a blurred academic hallway with subtle blue and white tones, matching a Corporate Modern design system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAB8ANXADTlLF00zOcuBFFmiistGcEzOUswrrN7mCd7_dfsE5V9MgZ_s7Mw1izPPVH_qKcTzNUR2gYyrBv7oXb94MgoRb31lybgzlZ_B9YY62Yi4UFm33BBBfjAfI0kZ58E6Pnr07vPBGBh63QDEKoHOV8IQIOvEbgA6YUNBRJmSw3td7NqLM3BISGZkD3xOcUmYGHntni5FrE-0MaMCWNgIUK8ebVz7CWOIpqwauvXaGqer7tQOPYMZePAAphKqQqDXJPI8dhqQWPX">
</div>
</div>
</div>

<!-- Main Content Canvas -->
<main class="max-w-4xl mx-auto px-margin-mobile py-lg pb-32">
<!-- Page Header -->
<div class="mb-xl">
<h2 class="font-title-lg text-title-lg text-on-surface-variant mb-xs">Redactar Mensaje</h2>
<p class="font-body-md text-on-surface-variant opacity-80">Comunícate con padres, alumnos o personal administrativo.</p>
</div>
<!-- Form Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden">
<form class="flex flex-col" id="messageForm">
<!-- Destinatario -->
<div class="p-md border-b border-outline-variant flex flex-col md:flex-row md:items-center gap-sm group">
<label class="font-label-lg text-label-lg text-on-surface-variant md:w-32" for="recipient">Destinatario</label>
<div class="relative flex-grow">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">person_add</span>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface transition-all" id="recipient" name="recipient" placeholder="Buscar por nombre o rol..." type="text">
</div>
</div>
<!-- Asunto -->
<div class="p-md border-b border-outline-variant flex flex-col md:flex-row md:items-center gap-sm group">
<label class="font-label-lg text-label-lg text-on-surface-variant md:w-32" for="subject">Asunto</label>
<div class="relative flex-grow">
<input class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface transition-all" id="subject" name="subject" placeholder="Tema del mensaje..." type="text">
</div>
</div>
<!-- Attachment / Tools Bar (Academic context) -->
<div class="px-md py-sm bg-surface-container-high flex items-center gap-md">
<button class="flex items-center gap-xs text-primary font-label-lg px-sm py-xs rounded-lg hover:bg-primary-container/10 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">attach_file</span>
<span>Adjuntar</span>
</button>
<button class="flex items-center gap-xs text-on-surface-variant font-label-lg px-sm py-xs rounded-lg hover:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">format_bold</span>
</button>
<button class="flex items-center gap-xs text-on-surface-variant font-label-lg px-sm py-xs rounded-lg hover:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">format_italic</span>
</button>
<button class="flex items-center gap-xs text-on-surface-variant font-label-lg px-sm py-xs rounded-lg hover:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>
</div>
<!-- Mensaje Body -->
<div class="p-md">
<textarea class="w-full p-md bg-surface-container-low border border-outline-variant rounded-lg font-body-lg text-on-surface resize-none custom-scrollbar transition-all" id="message" name="message" placeholder="Escribe tu mensaje aquí..." rows="12"></textarea>
</div>
<!-- Footer Actions -->
<div class="p-md bg-surface-container-lowest flex justify-between items-center border-t border-outline-variant">
<div class="flex items-center gap-sm">
<button class="p-sm rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Descartar borrador" type="button">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="flex items-center gap-md">
<button class="px-md py-sm text-primary font-label-lg hover:bg-surface-container-high rounded-lg transition-colors" type="button">Guardar Borrador</button>
<button class="flex items-center gap-sm px-lg py-sm bg-primary text-on-primary rounded-full font-label-lg shadow-md hover:shadow-lg active:scale-95 transition-all" id="sendBtn" type="submit">
<span>Enviar</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>

</div>

</div>

<p class="font-body-md text-on-surface-variant opacity-70">4to Grado - División A</p>
</div>
<div class="p-md bg-white border border-outline-variant rounded-xl hover:shadow-md transition-shadow cursor-pointer group">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-sm">
<span class="material-symbols-outlined">school</span>
</div>
<h3 class="font-title-md text-title-md">Dirección</h3>
<p class="font-body-md text-on-surface-variant opacity-70">Secretaría Académica</p>
</div>
<div class="p-md bg-white border border-outline-variant rounded-xl hover:shadow-md transition-shadow cursor-pointer group">

<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-lg py-xs active:scale-95 transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mail</span>
<span class="font-label-sm text-label-sm">Mensajes</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95 px-md py-xs" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</a>
</nav>
<script>
        // Micro-interactions
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = `<span>Enviando...</span><span class="material-symbols-outlined animate-spin">sync</span>`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = `<span>¡Enviado!</span><span class="material-symbols-outlined">check_circle</span>`;
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    btn.classList.remove('opacity-80', 'pointer-events-none');
                    document.getElementById('messageForm').reset();
                }, 2000);
            }, 1500);
        });

        // Highlight input row on focus
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.group')?.classList.add('bg-surface-container-low');
            });
            input.addEventListener('blur', () => {
                input.closest('.group')?.classList.remove('bg-surface-container-low');
            });
        });
    </script>
