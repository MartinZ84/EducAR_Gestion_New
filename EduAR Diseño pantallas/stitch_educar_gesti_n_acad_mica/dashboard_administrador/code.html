<script>
        // Simple touch feedback and micro-interactions
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            el.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Dynamic Greeting based on time
        const hour = new Date().getHours();
        const greetingEl = document.querySelector('.font-label-lg.text-label-lg');
        if (hour < 12) {
            greetingEl.textContent = "Buenos días,";
        } else if (hour < 19) {
            greetingEl.textContent = "Buenas tardes,";
        } else {
            greetingEl.textContent = "Buenas noches,";
        }
    </script>
